name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4.2.2

      - name: Descomprimir la app
        run: unzip -o .github/workflows/mesa-pro.zip -x '.github/*'

      - name: Aplicar la carpeta src (versión 2 encima del zip)
        run: |
          if [ -d src ]; then cp -r src/. . ; fi

      - name: Node 20
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4.5.0
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        run: echo "SDK preinstalado en el runner"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Crear el proyecto Android (solo la primera vez)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Ajustes de Android (permisos, avisos en segundo plano, versión 2.0)
        run: |
          if [ -f resources/patch-android.js ]; then
            MESA_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER)) node resources/patch-android.js
          fi

      - name: Poner ícono, pantalla de bienvenida y colores de las barras
        run: |
          RES=android/app/src/main/res
          cp -r resources/android/mipmap-* "$RES"/
          cp resources/android/values/*.xml "$RES"/values/
          find "$RES" -name splash.png -path "*land*" -exec cp resources/android/splash-land.png {} \;
          find "$RES" -name splash.png -not -path "*land*" -exec cp resources/android/splash-port.png {} \;

      - name: Armar el chequeo en segundo plano (runners/check.js)
        run: |
          if [ -f resources/build-runner.js ]; then node resources/build-runner.js; fi

      - name: Sincronizar la app web con Android
        run: npx cap sync android

      - name: Firma fija de depuración (si existe el secreto DEBUG_KEYSTORE_B64)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Firma fija instalada"
          else
            echo "Sin secreto: se usa una firma nueva en cada armado"
          fi

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4.4.3
        with:
          name: mesa-pro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Mover la etiqueta latest a este commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Publicar en Releases (latest)
        uses: softprops/action-gh-release@v2.0.9
        with:
          tag_name: latest
          name: Mesa PRO (última versión)
          body: "APK de prueba (debug). Bajá app-debug.apk e instalalo."
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
