name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4.2.2

      - name: Descomprimir la app (versión 3)
        run: unzip -o .github/workflows/mesa-pro.zip -x '.github/*'

      - name: Node 20
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4.5.0
        with:
          distribution: temurin
          java-version: 17

      # No se usa android-actions/setup-android: falla aceptando licencias. El runner ya trae el SDK.

      - name: Instalar dependencias (versiones fijas)
        run: npm install --no-audit --no-fund

      - name: Crear el proyecto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Ajustes de Android (permisos, atajos, enlaces mesapro://, splash animado, versión 3.0)
        run: MESA_VERSION_CODE=$((3000 + GITHUB_RUN_NUMBER)) node resources/patch-android.js

      - name: Poner ícono, pantalla de bienvenida y colores de las barras
        run: |
          RES=android/app/src/main/res
          cp -r resources/android/mipmap-* "$RES"/
          cp resources/android/values/*.xml "$RES"/values/
          find "$RES" -name splash.png -path "*land*" -exec cp resources/android/splash-land.png {} \;
          find "$RES" -name splash.png -not -path "*land*" -exec cp resources/android/splash-port.png {} \;

      - name: Armar el chequeo en segundo plano (runners/check.js)
        run: node resources/build-runner.js

      - name: Sincronizar la app web con Android
        run: npx cap sync android

      - name: Firma fija (secreto DEBUG_KEYSTORE_B64)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > android/app/fija.keystore
            printf "\nandroid { signingConfigs { debug { storeFile file('fija.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } } }\n" >> android/app/build.gradle
            echo "Firma fija instalada"
          else
            echo "::warning::Falta el secreto DEBUG_KEYSTORE_B64: el APK sale con una firma nueva y no se va a poder instalar encima."
          fi

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Tamaño y firma del APK
        run: |
          ls -l android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | sort -k1 -nr | head -8
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA256" || true

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4.4.3
        with:
          name: mesa-pro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Mover la etiqueta latest a este commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Publicar en Releases (latest)
        uses: softprops/action-gh-release@v2.0.9
        with:
          tag_name: latest
          name: Mesa PRO 3.0 (última versión)
          body: "APK de prueba (debug), firma fija. Bajá app-debug.apk e instalalo encima de la versión anterior."
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
